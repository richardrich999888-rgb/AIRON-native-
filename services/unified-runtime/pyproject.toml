[build-system]
requires = ["setuptools>=78"]
build-backend = "setuptools.build_meta"

[project]
name = "airon-runtime"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = ["cryptography>=41", "psutil>=7"]

[project.scripts]
airon = "airon_runtime.server:main"

[tool.setuptools.package-data]
airon_runtime = ["ui/*"]

[tool.setuptools.packages.find]
include = ["airon_runtime*"]
