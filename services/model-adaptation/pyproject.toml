[build-system]
requires = ["setuptools>=78"]
build-backend = "setuptools.build_meta"

[project]
name = "airon-adaptation"
version = "0.1.0"
requires-python = ">=3.11,<3.14"
dependencies = ["cryptography>=41"]

[project.scripts]
airon-adaptation = "airon_adaptation.server:main"

[tool.setuptools.package-data]
airon_adaptation = ["ui/*"]

[tool.setuptools.packages.find]
include = ["airon_adaptation*"]
