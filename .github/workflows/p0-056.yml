name: P0-056 unified runtime qualification
on:
  push:
    branches: [codex/p0-056-unified-airon-runtime]
    paths: ['services/unified-runtime/**', 'tests/integration/unified/**', '.github/workflows/p0-056.yml']
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-22.04
    timeout-minutes: 50
    env:
      AIRON_SOURCE_COMMIT: ${{ github.sha }}
      P056_AIP_COMMIT: f1ba9fc2072dac1431543fd4961baaa2762b8ea9
      PYTHONPATH: ${{ github.workspace }}/services/unified-runtime
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Prepare pinned dependencies and native interface
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y bubblewrap strace cmake
          python -m venv .venv
          .venv/bin/python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.9.1
          .venv/bin/python -m pip install -r services/model-adaptation/requirements-training.txt
          .venv/bin/python -m pip install 'docling-slim[format-markdown]==2.150.0' sentencepiece 'pip==26.2' 'setuptools==84.2.1'
          .venv/bin/python -m pip install ./services/model-adaptation
          git clone --no-checkout https://github.com/richardrich999888-rgb/AIP-agent-identity-protocol-.git "$RUNNER_TEMP/aip"
          git -C "$RUNNER_TEMP/aip" checkout --detach "$P056_AIP_COMMIT"
          rustup toolchain install 1.99.1 --profile minimal
          cargo +1.99.1 build --locked --manifest-path "$RUNNER_TEMP/aip/Cargo.toml" -p syntriass-runtime --bins
          cargo +1.99.1 test --locked --manifest-path "$RUNNER_TEMP/aip/Cargo.toml" -p syntriass-runtime
      - name: Provision approved model and build pinned llama.cpp
        run: |
          .venv/bin/python services/model-adaptation/scripts/provision.py --root "$RUNNER_TEMP/baseline" --assets "$RUNNER_TEMP/assets" --approve-synthetic-data
          git init "$RUNNER_TEMP/llama"
          git -C "$RUNNER_TEMP/llama" fetch --depth 1 https://github.com/ggml-org/llama.cpp.git 2a4daf0e08d6a9b6993ee0d4a9a3cfc35a6f405c
          git -C "$RUNNER_TEMP/llama" checkout --detach FETCH_HEAD
          cmake -S "$RUNNER_TEMP/llama" -B "$RUNNER_TEMP/llama-build" -DGGML_NATIVE=OFF -DLLAMA_CURL=OFF -DLLAMA_BUILD_TESTS=OFF -DCMAKE_BUILD_TYPE=Release
          cmake --build "$RUNNER_TEMP/llama-build" --target llama-completion -j 2
          PYTHONPATH="$RUNNER_TEMP/llama/gguf-py" .venv/bin/python "$RUNNER_TEMP/llama/convert_hf_to_gguf.py" "$RUNNER_TEMP/assets" --outfile "$RUNNER_TEMP/135m.gguf" --outtype f16
      - name: Real integration and preserved baseline tests
        env:
          P056_ASSETS: ${{ runner.temp }}/assets
          P056_AIP_SOURCE: ${{ runner.temp }}/aip
          P056_AIP_BIN: ${{ runner.temp }}/aip/target/debug
        run: |
          mkdir -p qualification
          .venv/bin/python -m pytest -q tests/integration/soup tests/integration/unified --junitxml=qualification/tests.xml
          python -m unittest discover -s website/offline -p test_server.py
      - name: Execute complete integrated slice with no external route
        run: |
          .venv/bin/python services/unified-runtime/scripts/provision.py --root "$RUNNER_TEMP/unified" --assets "$RUNNER_TEMP/assets" --aip-dir "$RUNNER_TEMP/aip" --bin-dir "$RUNNER_TEMP/aip/target/debug" --llama "$RUNNER_TEMP/llama-build/bin/llama-completion" --gguf "$RUNNER_TEMP/135m.gguf" --approve-synthetic-data
          strace -ff -e trace=network -o qualification/network unshare --user --map-root-user --net .venv/bin/python services/unified-runtime/scripts/run_demo.py --root "$RUNNER_TEMP/unified" --report qualification/demo.json --backend llama --approve-synthetic-test-deployment
      - name: Prepare complete local wheelhouse
        if: always()
        run: .venv/bin/python services/unified-runtime/scripts/prepare_offline.py --output "$RUNNER_TEMP/wheels"
      - name: Fresh install and native smoke test without external network
        run: |
          python -m venv "$RUNNER_TEMP/offline"
          unshare --user --map-root-user --net "$RUNNER_TEMP/offline/bin/python" -m pip install --no-index --find-links "$RUNNER_TEMP/wheels" --require-hashes -r "$RUNNER_TEMP/wheels/requirements.lock"
          unshare --user --map-root-user --net "$RUNNER_TEMP/offline/bin/python" -m pip check
          unshare --user --map-root-user --net env -u PYTHONPATH "$RUNNER_TEMP/offline/bin/python" -c "from airon_runtime.core import Core; c=Core('$RUNNER_TEMP/unified'); r=c.call(c.principal('operator'),'execute',{'capability_id':'airon.cooling.inspection','text':'cooling hours 210 vibration 2'}); assert r['result']['cost']['model_calls']==0; c.close()"
      - name: Preserve nonsecret raw evidence
        if: always()
        run: |
          mkdir -p qualification/logs
          if [ -d "$RUNNER_TEMP/unified/adaptation/jobs" ]; then
            find "$RUNNER_TEMP/unified/adaptation/jobs" -name worker.log -exec cp --parents {} qualification/logs/ \;
          fi
          if [ -d "$RUNNER_TEMP/unified/adaptation/candidates" ]; then
            cp -r "$RUNNER_TEMP/unified/adaptation/candidates" qualification/candidates
          fi
          if [ -f "$RUNNER_TEMP/wheels/requirements.lock" ]; then
            cp "$RUNNER_TEMP/wheels/requirements.lock" qualification/
            cp "$RUNNER_TEMP/wheels/wheelhouse.json" qualification/
            cp "$RUNNER_TEMP/wheels/licences.json" qualification/
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: p0-056-qualification
          path: qualification/
