name: AIRON CIIC console
on:
  push:
    branches: [feature/airon-native-ciic-enterprise-intelligence]
    paths: ['apps/airon-console/**', 'website/offline/**', 'docs/CIIC_NAVIGATION_BASELINE.json', '.github/workflows/airon-ciic.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults:
      run:
        working-directory: apps/airon-console
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/airon-console/package-lock.json
      - name: Install pinned local document and telemetry dependencies
        run: |
          python3 -m venv "$RUNNER_TEMP/airon-python"
          "$RUNNER_TEMP/airon-python/bin/pip" install --require-hashes -r intelligence/requirements.txt
          echo "$RUNNER_TEMP/airon-python/bin" >> "$GITHUB_PATH"
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Check the given VANIAN baseline
        run: |
          git init "$RUNNER_TEMP/aip"
          git -C "$RUNNER_TEMP/aip" remote add origin https://github.com/richardrich999888-rgb/AIP-agent-identity-protocol-
          git -C "$RUNNER_TEMP/aip" fetch --depth=1 origin e574a03206d29a4cf1d4fd8637231999f43b2aaf
          git -C "$RUNNER_TEMP/aip" checkout --detach FETCH_HEAD
          cd "$RUNNER_TEMP/aip/apps/vanian-console"
          npm ci
          npm run build
          npx playwright test --grep 'home drill-down counts'
      - run: python3 -m unittest discover -s intelligence -v
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - name: Capture the ownership workflow
        env:
          CIIC_CAPTURE_DIR: ${{ runner.temp }}/ciic-screens
        run: npx playwright test tests/ui/intelligence.spec.ts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: CIIC-console-screens
          path: ${{ runner.temp }}/ciic-screens/*.png
          if-no-files-found: warn
          retention-days: 60
      - name: Provision pinned AIP native verifier tools
        run: |
          git -C "$RUNNER_TEMP/aip" fetch --depth=1 origin d8ea36255d311b10b9b5b6e844336058622d45c6
          rustup toolchain install 1.99.1 --profile minimal
      - name: Run native, core and browser regression suites
        env:
          AIP_CHECKOUT: ${{ runner.temp }}/aip
        run: npm run verify:aip-console
  local-inference:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults:
      run:
        working-directory: apps/airon-console
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/airon-console/package-lock.json
      - name: Install pinned local document and telemetry dependencies
        run: |
          python3 -m venv "$RUNNER_TEMP/airon-python"
          "$RUNNER_TEMP/airon-python/bin/pip" install --require-hashes -r intelligence/requirements.txt
          echo "$RUNNER_TEMP/airon-python/bin" >> "$GITHUB_PATH"
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Provision the pinned local CPU model
        run: |
          trap 'docker logs --tail 60 airon-ollama 2>&1 || true' ERR
          docker run --detach --name airon-ollama -p 127.0.0.1:11434:11434 -e OLLAMA_HOST=0.0.0.0:11434 -e OLLAMA_NO_CLOUD=1 -e OLLAMA_NUM_PARALLEL=1 ollama/ollama:0.40.17@sha256:ccc42bcd3d5fcf7ab0d532b300382154e1a4da56fc666bdb313b78ebdd912754
          curl --fail --silent --show-error --max-time 4 --retry 20 --retry-all-errors --retry-delay 2 --retry-max-time 65 http://127.0.0.1:11434/api/version
          docker exec airon-ollama ollama pull qwen2.5:0.5b
          curl --fail --silent http://127.0.0.1:11434/api/tags | python3 -c 'import json,sys; assert any(m["name"]=="qwen2.5:0.5b" and m["digest"]=="a8b0c51577010a279d933d14c2a8ab4b268079d44c5c8830c0a93900f1827c67" for m in json.load(sys.stdin)["models"])'
      - run: npm run build
      - name: Exercise inference, PDF, approval, telemetry and verification through Chromium
        env:
          AIRON_TEST_MODEL: qwen2.5:0.5b
          CIIC_CAPTURE_DIR: ${{ runner.temp }}/measured-console
        run: npx playwright test tests/ui/intelligence.spec.ts --retries=0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: local-inference-evidence
          path: ${{ runner.temp }}/measured-console/
          if-no-files-found: warn
          retention-days: 60
