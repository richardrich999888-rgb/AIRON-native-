name: P0-052 adaptation qualification
on:
  pull_request:
    paths:
      - 'services/model-adaptation/**'
      - 'tests/integration/soup/**'
      - '.github/workflows/p0-052.yml'
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: python -m pip install 'cryptography==50.0.2' 'pytest==9.2.0'
      - name: Controller and adversarial fixtures
        run: python -m pytest -q tests/integration/soup --junitxml=contract-results.xml
      - name: Existing local gateway regression
        working-directory: website/offline
        run: python -m unittest test_server.py
      - name: Existing website regression
        run: npm --prefix website ci && npm test && npm run build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: p0-052-contract-results
          path: contract-results.xml
