name: P0-052 adaptation qualification
on:
  pull_request:
    paths:
      - 'services/model-adaptation/**/*.py'
      - 'services/model-adaptation/**/*.json'
      - 'services/model-adaptation/**/*.toml'
      - 'services/model-adaptation/requirements*.txt'
      - 'services/model-adaptation/constraints*.txt'
      - 'services/model-adaptation/airon_adaptation/ui/**'
      - 'tests/integration/soup/**'
      - '.github/workflows/p0-052.yml'
env:
  AIRON_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha }}
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: python -m pip install 'cryptography==50.0.2' 'pytest==9.2.0' ./services/model-adaptation 'soup-cli @ git+https://github.com/MakazhanAlpamys/Soup.git@af2f5d5000f7baec6386a72a6d16e82383eb5303'
      - name: Controller and adversarial fixtures
        run: python -m pytest -q tests/integration/soup --junitxml=contract-results.xml
      - name: Verify retained real evidence against reviewed public anchors
        run: python services/model-adaptation/scripts/verify_evidence.py docs/qualification/p0-052/evidence/cpu-28daa9b.json --trusted-public-key 29e42921f7e07fcf21babec55dbc38fcd0e1269f23bbb91eb9d5db138271addc --expected-head 84b49c9b914d20fc596b4b4c776e22a6ff379f093c601e4291988e67eec691d6
      - name: Existing local gateway regression
        working-directory: website/offline
        run: python -m unittest test_server.py
      - name: Existing website regression
        run: npm --prefix website ci && npm test && npm run build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: p0-052-contract-results
          path: contract-results.xml
  real-cpu-experiment:
    needs: contracts
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Prepare bounded CPU runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y bubblewrap strace
          python -m venv .venv
          .venv/bin/python -m pip install --no-cache-dir --index-url https://download.pytorch.org/whl/cpu 'torch==2.9.1'
          .venv/bin/python -m pip install --no-cache-dir -r services/model-adaptation/requirements-training.txt
          .venv/bin/python -m pip install -e services/model-adaptation
      - name: Provision pinned weights and authorised synthetic data
        run: .venv/bin/python services/model-adaptation/scripts/provision.py --root "$RUNNER_TEMP/airon-state" --assets "$RUNNER_TEMP/airon-assets" --approve-synthetic-data
      - name: Genuine Soup data operation under isolation
        run: |
          readlink /proc/self/ns/net
          unshare --user --map-root-user --net /bin/sh -c 'readlink /proc/self/ns/net; cat /proc/self/net/route'
          .venv/bin/python services/model-adaptation/scripts/probe_sandbox.py --root "$RUNNER_TEMP/airon-state"
      - name: Real CPU training and governed lifecycle
        run: |
          mkdir -p acceptance-evidence
          strace -ff -e trace=network -o acceptance-evidence/network .venv/bin/python services/model-adaptation/scripts/run_acceptance.py --root "$RUNNER_TEMP/airon-state" --report acceptance-evidence/acceptance.json --approve-synthetic-test-deployment
      - name: Prepare hash-locked offline wheels
        run: .venv/bin/python services/model-adaptation/scripts/prepare_wheelhouse.py --output "$RUNNER_TEMP/airon-wheels" --source services/model-adaptation
      - name: Install fresh runtime without network
        run: |
          python -m venv "$RUNNER_TEMP/airon-offline-runtime"
          unshare --user --map-root-user --net "$RUNNER_TEMP/airon-offline-runtime/bin/python" -m pip install --no-cache-dir --no-index --find-links "$RUNNER_TEMP/airon-wheels" --require-hashes -r "$RUNNER_TEMP/airon-wheels/requirements.lock"
          cp "$RUNNER_TEMP/airon-wheels/requirements.lock" acceptance-evidence/
          cp "$RUNNER_TEMP/airon-wheels/wheelhouse.json" acceptance-evidence/
          cp "$RUNNER_TEMP/airon-wheels/licences.json" acceptance-evidence/
          cp -r "$RUNNER_TEMP/airon-wheels/notices" acceptance-evidence/
      - name: Repeat complete workflow with isolated controller and fresh runtime
        run: |
          AIRON_HOST_NETNS=$(readlink /proc/self/ns/net)
          strace -ff -e trace=network -o acceptance-evidence/offline-network unshare --user --map-root-user --net "$RUNNER_TEMP/airon-offline-runtime/bin/python" services/model-adaptation/scripts/offline_acceptance.py --root "$RUNNER_TEMP/airon-offline-state" --assets "$RUNNER_TEMP/airon-assets" --report acceptance-evidence/offline-acceptance.json --parent-netns "$AIRON_HOST_NETNS"
      - name: Classify complete offline network trace
        if: always()
        run: .venv/bin/python services/model-adaptation/scripts/audit_network.py --prefix acceptance-evidence/offline-network --report acceptance-evidence/network-audit.json
      - name: Check guided console against the completed real workspace
        run: |
          .venv/bin/python -m pip install 'playwright==1.65.1'
          .venv/bin/python -m playwright install --with-deps chromium
          .venv/bin/python services/model-adaptation/scripts/check_console.py --root "$RUNNER_TEMP/airon-offline-state" --output acceptance-evidence/console
      - name: Real process cancellation and malformed model rejection
        if: always()
        run: .venv/bin/python services/model-adaptation/scripts/run_fault_acceptance.py --source-root "$RUNNER_TEMP/airon-state" --root "$RUNNER_TEMP/airon-fault-state" --report acceptance-evidence/real-faults.json --authorize-synthetic-fault-tests
      - name: Collect nonsecret diagnostics
        if: always()
        run: |
          mkdir -p acceptance-evidence/logs
          .venv/bin/python services/model-adaptation/scripts/collect_runtime.py --output acceptance-evidence/runtime-prerequisites.json
          if [ -d "$RUNNER_TEMP/airon-offline-state/candidates" ]; then
            cp -r "$RUNNER_TEMP/airon-offline-state/candidates" acceptance-evidence/offline-candidates
          fi
          if [ -d "$RUNNER_TEMP/airon-state/candidates" ]; then
            cp -r "$RUNNER_TEMP/airon-state/candidates" acceptance-evidence/primary-candidates
          fi
          cp services/model-adaptation/model.lock.json acceptance-evidence/
          cp services/model-adaptation/fixtures/LICENSE.txt acceptance-evidence/SYNTHETIC-DATA-LICENSE.txt
          cp docs/integrations/soup/third_party/Soup-LICENSE.txt acceptance-evidence/Apache-2.0.txt
          if [ -f "$RUNNER_TEMP/airon-assets/README.md" ]; then
            cp "$RUNNER_TEMP/airon-assets/README.md" acceptance-evidence/BASE-MODEL-CARD.md
          fi
          if [ -d "$RUNNER_TEMP/airon-state/jobs" ]; then
            find "$RUNNER_TEMP/airon-state/jobs" -name worker.log -exec cp --parents {} acceptance-evidence/logs/ \;
            find "$RUNNER_TEMP/airon-state/jobs" -name worker.log -exec tail -c 16000 {} \;
          fi
          if [ -d "$RUNNER_TEMP/airon-offline-state/jobs" ]; then
            find "$RUNNER_TEMP/airon-offline-state/jobs" -name worker.log -exec cp --parents {} acceptance-evidence/logs/ \;
            find "$RUNNER_TEMP/airon-offline-state/jobs" -name worker.log -exec tail -c 16000 {} \;
          fi
          if [ -d "$RUNNER_TEMP/airon-fault-state/jobs" ]; then
            find "$RUNNER_TEMP/airon-fault-state/jobs" -name worker.log -exec cp --parents {} acceptance-evidence/logs/ \;
            find "$RUNNER_TEMP/airon-fault-state/jobs" -name worker.log -exec tail -c 16000 {} \;
          fi
          if [ -f "$RUNNER_TEMP/airon-state/provisioning.json" ]; then
            cp "$RUNNER_TEMP/airon-state/provisioning.json" acceptance-evidence/
            cp "$RUNNER_TEMP/airon-state/resolved-requirements.txt" acceptance-evidence/
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: p0-052-real-cpu-evidence
          path: acceptance-evidence/
